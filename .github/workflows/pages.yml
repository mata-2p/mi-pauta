name: Checks y Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Pauta textual (check_verbatim)
        run: python3 -I tests/pauta-personal/check_verbatim.py pauta-personal/index.html

      - name: Página de registro (check_registro)
        run: |
          if [ -f pauta-personal/registro.html ]; then
            python3 -I tests/pauta-personal/check_registro.py pauta-personal/registro.html
          else
            echo "pauta-personal/registro.html no existe; se omite"
          fi

      - name: Estructura responsive (check_responsive)
        run: python3 -I tests/pauta-personal/check_responsive.py pauta-personal

      - name: Tests de JavaScript (node --test)
        run: |
          if [ -n "$(find tests/pauta-personal -name '*.test.mjs' -print -quit)" ]; then
            node --test 'tests/pauta-personal/*.test.mjs'
          else
            echo "no hay *.test.mjs; se omite"
          fi

      - name: Guardia de contenido sensible
        run: python3 -I tools/guardia_sensible.py --excluir .git .

  # Upload and deploy run in separate jobs: deploy-pages can start before an
  # artifact uploaded in its own job is visible ("No artifacts named
  # github-pages"), and re-running only the deploy job reuses the one artifact.
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pauta-personal

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
